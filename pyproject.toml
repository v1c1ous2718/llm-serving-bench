[project]
name = "serving-load"
version = "0.1.0"
description = "Load experiments for vLLM on one RTX 3060 (see DESIGN.md)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "numpy>=2.0",
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sl"]
